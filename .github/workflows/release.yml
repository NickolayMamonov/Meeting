name: Android release

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.authority.outputs.release_created }}
      materialize: ${{ steps.authority.outputs.materialize }}
      tag_name: ${{ steps.authority.outputs.tag_name }}
      source_sha: ${{ steps.authority.outputs.source_sha }}
      release_id: ${{ steps.authority.outputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: dev
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Resolve canonical release authority
        id: authority
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          ACTION_RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          ACTION_TAG_NAME: ${{ steps.release.outputs.tag_name }}
          ACTION_SOURCE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin dev

          emit_noop() {
            {
              echo "release_created=false"
              echo "materialize=false"
              echo "tag_name="
              echo "source_sha="
              echo "release_id="
            } >> "$GITHUB_OUTPUT"
          }

          valid_sha() {
            printf '%s' "$1" | grep -Eq '^[0-9a-fA-F]{40}$'
          }

          manifest_version="$(jq -er '.["."]' .release-please-manifest.json)"
          manifest_tag="v${manifest_version}"
          release_created="${ACTION_RELEASE_CREATED:-false}"
          state="$RUNNER_TEMP/release-authority.json"
          release_pages="$RUNNER_TEMP/release-pages.json"
          release_error="$RUNNER_TEMP/release-list-error.txt"

          if [ "$release_created" = "true" ]; then
            tag_name="$ACTION_TAG_NAME"
            source_sha="$ACTION_SOURCE_SHA"
          elif [ "$release_created" = "false" ]; then
            tag_name="$manifest_tag"
          else
            echo "unexpected Release Please release_created output" >&2
            exit 1
          fi

          if ! gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$release_pages" 2> "$release_error"; then
            cat "$release_error" >&2
            exit 1
          fi
          matches="$RUNNER_TEMP/release-matches.json"
          if ! jq -e --arg tag "$tag_name" '
            def malformed:
              (type != "object") or
              (has("id") | not) or
              (has("tag_name") | not) or
              (has("target_commitish") | not) or
              (has("draft") | not) or
              (has("published_at") | not) or
              (has("assets") | not) or
              ((.id | type) != "number") or
              ((.tag_name | type) != "string") or
              ((.target_commitish | type) != "string") or
              ((.draft | type) != "boolean") or
              ((.published_at != null) and ((.published_at | type) != "string")) or
              ((.assets | type) != "array");
            if (type != "array" or length == 0 or
                any(.[]; (type != "array") or length > 100) or
                (.[0:-1] | any(.[]; length != 100)) or
                (.[-1] | length >= 100) or
                any(.[][]; malformed)) then
              error("release list pagination is incomplete or malformed")
            else
              [.[][] | select(.tag_name == $tag)]
            end
          ' "$release_pages" > "$matches"; then
            echo "release list pagination is incomplete or malformed" >&2
            exit 1
          fi
          match_count="$(jq -er 'length' "$matches")"
          if [ "$match_count" -eq 0 ]; then
            if [ "$release_created" = "true" ]; then
              echo "new Release Please draft is missing from the releases list: $tag_name" >&2
              exit 1
            fi
            emit_noop
            exit 0
          fi
          if [ "$match_count" -ne 1 ]; then
            echo "release list contains duplicate exact tag matches: $tag_name" >&2
            exit 1
          fi
          jq -e '.[0]' "$matches" > "$state"
          if [ "$release_created" = "false" ]; then
            if jq -e '(.draft != true) or (.published_at != null)' "$state" >/dev/null; then
              emit_noop
              exit 0
            fi
            source_sha="$(jq -er '.target_commitish' "$state")"
          fi

          valid_sha "$source_sha"
          test -n "$tag_name"
          test "$tag_name" = "v$(git show "$source_sha:version.json" | jq -er '.version')"
          git merge-base --is-ancestor "$source_sha" origin/dev
          if git ls-remote --exit-code --refs origin "refs/tags/$tag_name" >/dev/null 2>&1; then
            echo "release tag already exists: $tag_name" >&2
            exit 1
          fi

          release_id="$(jq -er '.id' "$state")"
          test "$release_id" -gt 0
          jq -e --arg tag "$tag_name" --arg sha "$source_sha" --argjson id "$release_id" \
            '.id == $id and .tag_name == $tag and .target_commitish == $sha and
             .draft == true and (.published_at == null) and (.assets | length == 0)' \
            "$state" >/dev/null
          {
            echo "release_created=$release_created"
            echo "materialize=true"
            echo "tag_name=$tag_name"
            echo "source_sha=$source_sha"
            echo "release_id=$release_id"
          } >> "$GITHUB_OUTPUT"

  stable-build:
    name: Build unsigned stable artifacts
    needs: release-please
    if: ${{ needs.release-please.outputs.materialize == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: android-release
    permissions:
      contents: read
    outputs:
      release_id: ${{ needs.release-please.outputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-please.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4.4.2
      - name: Validate canonical draft authority
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.source_sha }}
          RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin dev
          git merge-base --is-ancestor "$RELEASE_SHA" origin/dev
          version="$(git show "$RELEASE_SHA:version.json" | jq -er '.version')"
          test "$RELEASE_TAG" = "v$version"
          if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          state="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_SHA" --argjson id "$RELEASE_ID" \
            '.id == $id and .tag_name == $tag and .target_commitish == $sha and
             .draft == true and (.published_at == null) and (.assets | length == 0)' <<<"$state" >/dev/null
      - name: Provision stable Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: Validate stable Firebase configuration
        run: |
          set -euo pipefail
          jq -e '
            type == "object" and
            (.project_info | type == "object") and
            (.client | type == "array" and length > 0) and
            any(.client[];
              type == "object" and
              (.client_info | type == "object") and
              (.client_info.android_client_info | type == "object") and
              (.client_info.android_client_info.package_name == "dev.whysoezzy.meet")
            )
          ' app/google-services.json >/dev/null
      - name: Build unsigned stable artifacts
        env:
          ORG_GRADLE_PROJECT_BASE_URL_RELEASE: ${{ vars.BASE_URL_RELEASE }}
          ORG_GRADLE_PROJECT_ANDROID_RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERTIFICATE_SHA256 }}
          ORG_GRADLE_PROJECT_RELEASE_COMMIT_SHA: ${{ needs.release-please.outputs.source_sha }}
          ORG_GRADLE_PROJECT_RELEASE_PUBLISHING: "true"
        run: |
          set -euo pipefail
          ./gradlew generateReleaseBuildMetadata validateReleasePublishingInputs ktlintCheck \
            testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-unsigned-${{ needs.release-please.outputs.tag_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/**
            app/build/outputs/native-debug-symbols/release/**
            app/build/release-metadata/release-build.json
          if-no-files-found: error
      - name: Remove Firebase configuration
        if: ${{ always() }}
        run: rm -f app/google-services.json

  stable-sign:
    name: Sign stable artifacts on isolated runner
    needs: [release-please, stable-build]
    if: ${{ needs.stable-build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: android-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Resolve stable apksigner
        run: |
          set -euo pipefail
          apksigner="$(python release-tooling/scripts/release/android_sdk_tools.py apksigner)"
          test -x "$apksigner"
          printf 'APKSIGNER_PATH=%s\n' "$apksigner" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-release-unsigned-${{ needs.release-please.outputs.tag_name }}
          path: unsigned
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Sign and verify stable artifacts
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.RELEASE_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          apk="$(find unsigned -name '*.apk' -print -quit)"
          aab="$(find unsigned -name '*.aab' -print -quit)"
          test -n "$apk" && test -n "$aab"
          apksigner="$APKSIGNER_PATH"
          test -x "$apksigner"
          umask 077
          printf '%s' "$STORE_PASSWORD" > "$RUNNER_TEMP/release-store-password"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/release-key-password"
          "$apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias meet-release \
            --ks-pass "file:$RUNNER_TEMP/release-store-password" \
            --key-pass "file:$RUNNER_TEMP/release-key-password" "$apk"
          printf '%s\n%s\n' "$STORE_PASSWORD" "$KEY_PASSWORD" | \
            jarsigner -keystore "$RUNNER_TEMP/release.jks" "$aab" meet-release
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-cert.txt"
          keytool -printcert -jarfile "$aab" > "$RUNNER_TEMP/aab-cert.txt"
          grep -Eiq 'key algorithm: RSA' "$RUNNER_TEMP/apk-cert.txt"
          grep -Eiq 'key size( \(bits\))?: 4096' "$RUNNER_TEMP/apk-cert.txt"
          grep -Eiq 'Public Key Algorithm: 4096-bit RSA key' "$RUNNER_TEMP/aab-cert.txt"
          expected="$(printf '%s' "$EXPECTED_CERT" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          apk_actual="$(sed -n 's/.*SHA-256 digest: //p' "$RUNNER_TEMP/apk-cert.txt" | head -n1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          aab_actual="$(sed -n 's/.*SHA256: //p' "$RUNNER_TEMP/aab-cert.txt" | head -n1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          test "$apk_actual" = "$expected" && test "$aab_actual" = "$expected"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-signed-${{ needs.release-please.outputs.tag_name }}
          path: unsigned
          if-no-files-found: error
      - name: Remove release signing inputs
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/release-store-password" "$RUNNER_TEMP/release-key-password"

  stable-evidence:
    name: Verify and attest stable artifacts
    needs: [release-please, stable-sign]
    if: ${{ needs.stable-sign.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-please.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Resolve stable Android SDK tools
        run: |
          set -euo pipefail
          apksigner="$(python release-tooling/scripts/release/android_sdk_tools.py apksigner)"
          apkanalyzer="$(python release-tooling/scripts/release/android_sdk_tools.py apkanalyzer)"
          test -x "$apksigner" && test -x "$apkanalyzer"
          printf 'APKSIGNER_PATH=%s\n' "$apksigner" >> "$GITHUB_ENV"
          printf 'APKANALYZER_PATH=%s\n' "$apkanalyzer" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-release-signed-${{ needs.release-please.outputs.tag_name }}
          path: signed
      - name: Download and verify reviewed Bundletool
        run: |
          set -euo pipefail
          readonly bundletool_version='1.18.3'
          readonly bundletool_sha256='a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29'
          printf '%s' "$bundletool_version" | grep -Eq '^1\.[0-9]+\.[0-9]+$'
          printf '%s' "$bundletool_sha256" | grep -Eq '^[0-9a-f]{64}$'
          curl --fail --location --silent --show-error \
            "https://github.com/google/bundletool/releases/download/$bundletool_version/bundletool-all-$bundletool_version.jar" \
            --output "$RUNNER_TEMP/bundletool.jar"
          echo "$bundletool_sha256  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Verify APK, AAB, package, version, and certificate identity
        run: |
          set -euo pipefail
          metadata="$(find signed -name release-build.json -print -quit)"
          apk="$(find signed -name '*.apk' -print -quit)"
          aab="$(find signed -name '*.aab' -print -quit)"
          python release-tooling/scripts/release/verify_android_artifacts.py \
            --metadata "$metadata" --apk "$apk" --aab "$aab" \
            --apksigner "$APKSIGNER_PATH" --apkanalyzer "$APKANALYZER_PATH" \
            --expected-debuggable false \
            --bundletool-jar "$RUNNER_TEMP/bundletool.jar" \
            --bundletool-sha256 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29'
      - name: Prepare deterministic release evidence
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.source_sha }}
        run: |
          set -euo pipefail
          metadata="$(find signed -name release-build.json -print -quit)"
          apk="$(find signed -name '*.apk' -print -quit)"
          aab="$(find signed -name '*.aab' -print -quit)"
          mapping="$(find signed -type f -path '*/mapping/release/*' -print -quit || true)"
          symbols="$(find signed -type f -path '*/native-debug-symbols/release/*' -print -quit || true)"
          mkdir -p release-output
          args=(--metadata "$metadata" --output release-output --apk "$apk" --aab "$aab"
            --tag "$RELEASE_TAG" --commit "$RELEASE_SHA" --source-branch dev
            --workflow "${GITHUB_WORKFLOW}" --prepare-only)
          test -z "$mapping" || args+=(--mapping "$mapping")
          test -z "$symbols" || args+=(--symbols "$symbols")
          python release-tooling/scripts/release/package_artifacts.py "${args[@]}"
      - uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: release-output/*
      - name: Collect exhaustive canonical attestation evidence
        env:
          ATTESTATION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python release-tooling/scripts/release/collect_attestation_evidence.py \
            --directory release-output \
            --output "$RUNNER_TEMP/release-attestation-evidence.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/dev --source-sha "${{ github.sha }}" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Finalize and verify release evidence
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.source_sha }}
        run: |
          set -euo pipefail
          metadata="$(find signed -name release-build.json -print -quit)"
          apk="$(find signed -name '*.apk' -print -quit)"
          aab="$(find signed -name '*.aab' -print -quit)"
          args=(--metadata "$metadata" --output release-output --apk "$apk" --aab "$aab"
            --tag "$RELEASE_TAG" --commit "$RELEASE_SHA" --source-branch dev
            --workflow "${GITHUB_WORKFLOW}"
            --attestation-evidence "$RUNNER_TEMP/release-attestation-evidence.json")
          mapping="$(find signed -type f -path '*/mapping/release/*' -print -quit || true)"
          symbols="$(find signed -type f -path '*/native-debug-symbols/release/*' -print -quit || true)"
          test -z "$mapping" || args+=(--mapping "$mapping")
          test -z "$symbols" || args+=(--symbols "$symbols")
          python release-tooling/scripts/release/package_artifacts.py "${args[@]}"
          python release-tooling/scripts/release/verify_chain.py release-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-evidence-${{ needs.release-please.outputs.tag_name }}
          path: release-output
          if-no-files-found: error

  stable-public-probe:
    name: Protected public backend probe
    needs: [release-please, stable-build, stable-evidence]
    if: ${{ needs.stable-evidence.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: android-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-please.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-release-evidence-${{ needs.release-please.outputs.tag_name }}
          path: release-output
      - name: Revalidate immutable draft before public probe
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.source_sha }}
          VERIFIED_RELEASE_ID: ${{ needs.stable-build.outputs.release_id }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/$GITHUB_REPOSITORY/releases/$VERIFIED_RELEASE_ID")"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_SHA" --argjson id "$VERIFIED_RELEASE_ID" \
            '.id == $id and .tag_name == $tag and .target_commitish == $sha and
             .draft == true and (.published_at == null) and (.assets | length == 0)' <<<"$state" >/dev/null
      - name: Probe public production backend
        run: python release-tooling/scripts/release/public_backend_probe.py

  stable-mutate:
    name: Upload and publish verified draft
    needs: [release-please, stable-build, stable-evidence, stable-public-probe]
    if: ${{ needs.stable-public-probe.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: android-release
    permissions:
      contents: read
      attestations: read
    concurrency:
      group: android-release-${{ needs.release-please.outputs.tag_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Assert reviewed tooling revision
        env:
          EXPECTED_TOOLING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$EXPECTED_TOOLING_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git -C release-tooling rev-parse HEAD)" = "$EXPECTED_TOOLING_SHA"
      - name: Resolve release Android SDK tools
        run: |
          set -euo pipefail
          apksigner="$(python release-tooling/scripts/release/android_sdk_tools.py apksigner)"
          apkanalyzer="$(python release-tooling/scripts/release/android_sdk_tools.py apkanalyzer)"
          test -x "$apksigner" && test -x "$apkanalyzer"
          printf 'APKSIGNER_PATH=%s\n' "$apksigner" >> "$GITHUB_ENV"
          printf 'APKANALYZER_PATH=%s\n' "$apkanalyzer" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-release-evidence-${{ needs.release-please.outputs.tag_name }}
          path: release-output
      - name: Publish exactly one verified installer
        env:
          RELEASE_API_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          ATTESTATION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_API_TOKEN"
          test -n "$ATTESTATION_TOKEN"
          python release-tooling/scripts/release/publish_release.py \
            --repository "$GITHUB_REPOSITORY" \
            --release-id "${{ needs.stable-build.outputs.release_id }}" \
            --tag "${{ needs.release-please.outputs.tag_name }}" \
            --source-sha "${{ needs.release-please.outputs.source_sha }}" \
            --evidence-directory release-output \
            --manifest release-output/release-manifest.json \
            --rendered-body "$RUNNER_TEMP/release-notes.md" \
            --apksigner "$APKSIGNER_PATH" \
            --apkanalyzer "$APKANALYZER_PATH" \
            --attestation-signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --attestation-source-ref refs/heads/dev \
            --attestation-source-sha "${{ github.sha }}"
