name: Release credential audit

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

concurrency:
  group: release-credential-audit-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  release-please-credential-audit:
    name: release-please-credential-audit
    runs-on: ubuntu-latest
    # This job is intentionally unconditional for both event kinds. Only the
    # verifier may emit N/A, and only after reading explicit non-release
    # classification from the PR.
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    steps:
      - name: Checkout verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify release evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PRODUCER_WORKFLOW_ID: ${{ vars.RELEASE_PRODUCER_WORKFLOW_ID }}
          PRODUCER_WORKFLOW_PATH: .github/workflows/release-credential-audit.yml
          PRODUCER_ARTIFACT_NAME: credential-audit-evidence.json
          MERGE_QUEUE_EVIDENCE_JSON: ${{ vars.MERGE_QUEUE_EVIDENCE_JSON }}
        run: |
          set -euo pipefail
          python scripts/release/audit_cli.py
