name: Release static audit

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact PR-head tooling SHA for the protected harness
        required: false
        type: string
      publication_harness:
        description: Build the disposable signed fixture and run the loopback publication harness
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  QA_APPLICATION_SOURCE_SHA: 1670aa6b9a415c7638c9b5b348d9ecd991b736c8

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run focused release audits
        run: |
          python -m unittest discover -s scripts/release -p 'test_*.py'
          python scripts/release/test_publication_gates.py
          python scripts/release/test_snapshot_apksigner_workflow.py

  publication-fixture-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_harness == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Require exact QA identities
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$QA_APPLICATION_SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$EXPECTED_SHA" != "$QA_APPLICATION_SOURCE_SHA"
      - name: Checkout reviewed tooling head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout fixed real application source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.QA_APPLICATION_SOURCE_SHA }}
          path: application-source
          fetch-depth: 1
          persist-credentials: false
      - name: Assert both immutable checkout identities
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git -C release-tooling rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git -C application-source rev-parse HEAD)" = "$QA_APPLICATION_SOURCE_SHA"
          git -C release-tooling cat-file -e "$EXPECTED_SHA^{commit}"
          git -C application-source cat-file -e "$QA_APPLICATION_SOURCE_SHA^{commit}"
          test "$EXPECTED_SHA" != "$QA_APPLICATION_SOURCE_SHA"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Resolve QA Android SDK tools
        run: |
          set -euo pipefail
          apksigner="$(python release-tooling/scripts/release/android_sdk_tools.py apksigner)"
          apkanalyzer="$(python release-tooling/scripts/release/android_sdk_tools.py apkanalyzer)"
          test -x "$apksigner" && test -x "$apkanalyzer"
          printf 'APKSIGNER_PATH=%s\n' "$apksigner" >> "$GITHUB_ENV"
          printf 'APKANALYZER_PATH=%s\n' "$apkanalyzer" >> "$GITHUB_ENV"
      - name: Generate ephemeral QA signing inputs
        run: |
          set -euo pipefail
          umask 077
          store_password="$(openssl rand -hex 24)"
          key_password="$(openssl rand -hex 24)"
          printf '%s' "$store_password" > "$RUNNER_TEMP/qa-store-password"
          printf '%s' "$key_password" > "$RUNNER_TEMP/qa-key-password"
          keytool -genkeypair -alias meet-qa -keyalg RSA -keysize 4096 \
            -keystore "$RUNNER_TEMP/qa-release.jks" \
            -storetype JKS \
            -storepass "$store_password" -keypass "$key_password" \
            -dname 'CN=Meet QA' -validity 1
          fingerprint="$(keytool -list -v -keystore "$RUNNER_TEMP/qa-release.jks" \
            -storepass "$store_password" -alias meet-qa |
            sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n1 |
            tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$fingerprint" | grep -Eq '^[0-9a-f]{64}$'
          {
            printf 'QA_STORE_PASSWORD_FILE=%s\n' "$RUNNER_TEMP/qa-store-password"
            printf 'QA_KEY_PASSWORD_FILE=%s\n' "$RUNNER_TEMP/qa-key-password"
            printf 'ORG_GRADLE_PROJECT_BASE_URL_RELEASE=https://api.whysoezzy.online\n'
            printf 'ORG_GRADLE_PROJECT_ANDROID_RELEASE_CERT_SHA256=%s\n' "$fingerprint"
            printf 'ORG_GRADLE_PROJECT_RELEASE_PUBLISHING=true\n'
          } >> "$GITHUB_ENV"
      - name: Build the real application fixture with explicit provenance
        working-directory: application-source
        run: |
          set -euo pipefail
          test -f app/google-services-ci.json
          cp app/google-services-ci.json app/google-services.json
          ./gradlew -PreleaseCommitSha="$QA_APPLICATION_SOURCE_SHA" \
            generateReleaseBuildMetadata validateReleasePublishingInputs ktlintCheck \
            testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease
          metadata="$(find app/build/release-metadata -name release-build.json -print -quit)"
          jq -e --arg sha "$QA_APPLICATION_SOURCE_SHA" '.commitSha == $sha' "$metadata" >/dev/null
          rm -f app/google-services.json
      - name: Prepare and verify QA evidence from reviewed tooling
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          mkdir -p release-output
          apk="$(find application-source/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          aab="$(find application-source/app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$apk" && test -n "$aab"
          cp "$apk" "$RUNNER_TEMP/qa-unsigned.apk"
          cp "$aab" "$RUNNER_TEMP/qa-unsigned.aab"
          "$APKSIGNER_PATH" sign --ks "$RUNNER_TEMP/qa-release.jks" \
            --ks-key-alias meet-qa --ks-pass "file:$QA_STORE_PASSWORD_FILE" \
            --key-pass "file:$QA_KEY_PASSWORD_FILE" \
            "$RUNNER_TEMP/qa-unsigned.apk"
          store_password="$(< "$QA_STORE_PASSWORD_FILE")"
          key_password="$(< "$QA_KEY_PASSWORD_FILE")"
          jarsigner -keystore "$RUNNER_TEMP/qa-release.jks" \
            -storepass "$store_password" -keypass "$key_password" \
            "$RUNNER_TEMP/qa-unsigned.aab" meet-qa
          unset store_password key_password
          metadata="application-source/app/build/release-metadata/release-build.json"
          python release-tooling/scripts/release/package_artifacts.py \
            --metadata "$metadata" --output release-output --apk "$RUNNER_TEMP/qa-unsigned.apk" \
            --aab "$RUNNER_TEMP/qa-unsigned.aab" --tag v1.0.0-qa \
            --commit "$QA_APPLICATION_SOURCE_SHA" --source-branch "${GITHUB_REF_NAME}" \
            --workflow "${GITHUB_WORKFLOW}" --prepare-only
          python release-tooling/scripts/release/verify_android_artifacts.py \
            --metadata "$metadata" --apk release-output/Meet.apk \
            --apksigner "$APKSIGNER_PATH" --apkanalyzer "$APKANALYZER_PATH" \
            --expected-debuggable false
          printf '%s\n' "$EXPECTED_SHA" > "$RUNNER_TEMP/qa-tooling-sha"
      - uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: release-output/*
      - name: Collect and finalize QA evidence
        env:
          ATTESTATION_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          python release-tooling/scripts/release/collect_attestation_evidence.py \
            --directory release-output \
            --output "$RUNNER_TEMP/qa-attestation-evidence.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-credential-audit.yml" \
            --source-ref "$GITHUB_REF" --source-sha "$EXPECTED_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          metadata="application-source/app/build/release-metadata/release-build.json"
          python release-tooling/scripts/release/package_artifacts.py \
            --metadata "$metadata" --output release-output \
            --apk "$RUNNER_TEMP/qa-unsigned.apk" --aab "$RUNNER_TEMP/qa-unsigned.aab" \
            --tag v1.0.0-qa --commit "$QA_APPLICATION_SOURCE_SHA" \
            --source-branch "${GITHUB_REF_NAME}" --workflow "${GITHUB_WORKFLOW}" \
            --attestation-evidence "$RUNNER_TEMP/qa-attestation-evidence.json"
          python release-tooling/scripts/release/verify_chain.py release-output
      - name: Remove QA signing and Firebase inputs
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/qa-release.jks" "$RUNNER_TEMP/qa-unsigned.apk" "$RUNNER_TEMP/qa-unsigned.aab" "$RUNNER_TEMP/qa-store-password" "$RUNNER_TEMP/qa-key-password" application-source/app/google-services.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-publication-qa-evidence-${{ inputs.expected_sha }}-${{ github.run_attempt }}
          path: release-output
          retention-days: 7
          if-no-files-found: error

  publication-harness:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_harness == true }}
    needs: publication-fixture-evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Require exact QA tooling identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - name: Checkout reviewed tooling head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false
      - name: Assert tooling checkout HEAD
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git -C release-tooling rev-parse HEAD)" = "$EXPECTED_SHA"
          git -C release-tooling cat-file -e "$EXPECTED_SHA^{commit}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-release-publication-qa-evidence-${{ inputs.expected_sha }}-${{ github.run_attempt }}
          path: release-output
      - name: Run loopback publication harness with attestation-only credentials
        env:
          ATTESTATION_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test -n "$ATTESTATION_TOKEN"
          test -z "${RELEASE_API_TOKEN:-}"
          printf '%s' "$GITHUB_REF" | grep -Eq '^refs/heads/[^/]+$'
          python release-tooling/scripts/release/publication_harness.py \
            --evidence-directory release-output \
            --manifest release-output/release-manifest.json \
            --release-body 'Release Please QA fixture' \
            --tag v1.0.0-qa \
            --source-sha "$QA_APPLICATION_SOURCE_SHA" \
            --application-source-sha "$QA_APPLICATION_SOURCE_SHA" \
            --attestation-repository "$GITHUB_REPOSITORY" \
            --attestation-signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-credential-audit.yml" \
            --attestation-source-ref "$GITHUB_REF" \
            --attestation-source-sha "$EXPECTED_SHA" \
            --attestation-run-id "$GITHUB_RUN_ID" \
            --attestation-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --apksigner "$(python release-tooling/scripts/release/android_sdk_tools.py apksigner)" \
            --apkanalyzer "$(python release-tooling/scripts/release/android_sdk_tools.py apkanalyzer)" \
            > "$RUNNER_TEMP/publication-report-direct.json"
          python release-tooling/scripts/release/publication_harness.py \
            --evidence-directory release-output \
            --manifest release-output/release-manifest.json \
            --release-body 'Release Please QA fixture' \
            --tag v1.0.0-qa \
            --source-sha "$QA_APPLICATION_SOURCE_SHA" \
            --application-source-sha "$QA_APPLICATION_SOURCE_SHA" \
            --attestation-repository "$GITHUB_REPOSITORY" \
            --attestation-signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-credential-audit.yml" \
            --attestation-source-ref "$GITHUB_REF" \
            --attestation-source-sha "$EXPECTED_SHA" \
            --attestation-run-id "$GITHUB_RUN_ID" \
            --attestation-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --apksigner "$(python release-tooling/scripts/release/android_sdk_tools.py apksigner)" \
            --apkanalyzer "$(python release-tooling/scripts/release/android_sdk_tools.py apkanalyzer)" \
            --redirect \
            > "$RUNNER_TEMP/publication-report-redirect.json"
          python release-tooling/scripts/release/publication_harness.py \
            --evidence-directory release-output \
            --manifest release-output/release-manifest.json \
            --release-body 'Release Please QA fixture' \
            --tag v1.0.0-qa \
            --source-sha "$QA_APPLICATION_SOURCE_SHA" \
            --application-source-sha "$QA_APPLICATION_SOURCE_SHA" \
            --attestation-repository "$GITHUB_REPOSITORY" \
            --attestation-signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-credential-audit.yml" \
            --attestation-source-ref "$GITHUB_REF" \
            --attestation-source-sha "$EXPECTED_SHA" \
            --attestation-run-id "$GITHUB_RUN_ID" \
            --attestation-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --apksigner "$(python release-tooling/scripts/release/android_sdk_tools.py apksigner)" \
            --apkanalyzer "$(python release-tooling/scripts/release/android_sdk_tools.py apkanalyzer)" \
            --after-final-read-race \
            > "$RUNNER_TEMP/publication-report-race.json"
          jq -s '{direct: .[0], redirect: .[1], race: .[2]}' \
            "$RUNNER_TEMP/publication-report-direct.json" \
            "$RUNNER_TEMP/publication-report-redirect.json" \
            "$RUNNER_TEMP/publication-report-race.json" \
            > "$RUNNER_TEMP/publication-report.json"
          jq -e '
            .direct.transport.mode == "direct" and
            .redirect.transport.mode == "redirect" and
            .direct.transport.loopback_http and
            .redirect.transport.loopback_http and
            .direct.transport.credential_free_data_leg and
            .redirect.transport.credential_free_data_leg and
            .direct.transport.content_length_observed and
            .redirect.transport.content_length_observed and
            .direct.transport.asset_cap_bytes == 536870912 and
            .redirect.transport.asset_cap_bytes == 536870912 and
            ([.direct, .redirect][] | .transcript | any(.[]; .method == "POST" and (.path | endswith("/assets")))) and
            ([.direct, .redirect][] | .transcript | any(.[]; .method == "PATCH")) and
            ([.direct, .redirect][] | .android_checks.local and .android_checks.downloaded) and
            ([.direct, .redirect][] | .verification.attestation_local.verified and .verification.attestation_downloaded.verified) and
            ([.direct, .redirect, .race][] |
              (.rejection_matrix | keys | sort) == [
                "application_checkout_absent_commit",
                "application_checkout_head_mismatch",
                "asset_aab_upload",
                "asset_cap_constant",
                "asset_evidence_upload",
                "asset_extra",
                "asset_legacy_name",
                "asset_missing",
                "asset_original_name",
                "asset_source_link_misclassified",
                "body_drift_before_patch",
                "candidate_identity_mismatch",
                "checkout_head_identity",
                "duplicate_asset_names",
                "equal_identity",
                "final_asset_metadata_drift",
                "generated_metadata_mismatch",
                "invalid_release_id",
                "loopback_state_identity_mismatch",
                "manifest_identity_mismatch",
                "metadata_identity",
                "missing_assets",
                "no_pre_admission_post",
                "non_list_assets",
                "release_state_identity",
                "remote_tamper",
                "rest_boolean_asset_id",
                "rest_boolean_size",
                "rest_float_size",
                "rest_negative_asset_id",
                "rest_negative_size",
                "rest_oversized_size",
                "rest_size_mismatch",
                "rest_string_asset_id",
                "rest_string_size",
                "rest_zero_asset_id",
                "rest_zero_size",
                "source_drift_before_patch",
                "swapped_identity",
                "synthetic_identity",
                "tag_drift_before_patch",
                "tooling_checkout_absent_commit",
                "tooling_checkout_head_mismatch",
                "transport_301",
                "transport_303",
                "transport_307",
                "transport_308",
                "transport_digest_mismatch",
                "transport_fragment_location",
                "transport_malformed_location",
                "transport_missing_location",
                "transport_negative_size",
                "transport_non_https_location",
                "transport_overrun",
                "transport_oversized_size",
                "transport_relative_location",
                "transport_second_leg_non_200",
                "transport_second_redirect",
                "transport_truncation",
                "transport_userinfo_location",
                "transport_wrong_content_length",
                "transport_wrong_host_location",
                "transport_zero_size",
                "unknown_asset_name"
              ]) and
            ([.direct, .redirect, .race][] | (.rejection_matrix | to_entries | all(.[]; .value == true))) and
            .race.indeterminate == true and
            .race.classification == "excluded-concurrency/indeterminate" and
            .race.published == null and
            .race.race.injected and
            .race.race.detected_after_final_read and
            .race.race.post_patch_divergence and
            .race.race.request_counts.POST == 1 and
            .race.race.request_counts.PATCH == 1 and
            .race.race.request_counts.DELETE == 0 and
            (.race.race.retry_attempted == false) and
            (.race.race.repair_attempted == false) and
            .race.mutation_contract.exactly_one_post and
            .race.mutation_contract.exactly_one_patch and
            .race.mutation_contract.no_repair and
            .race.mutation_contract.no_retry
          ' "$RUNNER_TEMP/publication-report.json" >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-publication-qa-report-${{ inputs.expected_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-report.json
          retention-days: 7
          if-no-files-found: error
