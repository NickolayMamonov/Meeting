name: Release credential audit

on:
  push:
    branches: [master]
  # pull_request_target evaluates this workflow from the protected base
  # revision. No PR can modify the token-bearing workflow definition for the
  # run that audits it. Keep this workflow installed on the protected base
  # branch before making the check required.
  pull_request_target:
    branches: [dev]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

concurrency:
  group: release-credential-audit-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  protected-master-producer:
    name: protected-master-credential-audit-producer
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/master
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Emit protected producer evidence
        env:
          WORKFLOW_PATH: .github/workflows/release-credential-audit.yml
          OUTPUT: credential-audit-evidence.json
        run: python scripts/release/emit_credential_audit_evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: credential-audit-evidence.json
          path: credential-audit-evidence.json
          if-no-files-found: error

  release-please-credential-audit:
    name: release-please-credential-audit
    runs-on: ubuntu-latest
    if: ${{ always() && (github.event_name == 'pull_request_target' || github.event_name == 'merge_group') }}
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - name: Checkout verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The workflow itself is evaluated from the protected base branch
          # because pull_request_target is used above. Checkout the same
          # immutable base SHA so the verifier and its imports cannot drift.
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Determine trusted verifier availability
        id: trusted
        env:
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "$TRUSTED_BASE_SHA:scripts/release/audit_cli.py" 2>/dev/null &&
             git cat-file -e "$TRUSTED_BASE_SHA:scripts/release/release_evidence.py" 2>/dev/null; then
            echo "verifier_ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # This is only a bootstrap escape hatch for this first non-release
          # implementation PR: the target branch predates the verifier. It
          # performs no API call, checks no release evidence, and receives no
          # token. Future release PRs and all merge groups must have the
          # verifier in their trusted base or fail closed.
          test "$GITHUB_EVENT_NAME" = "pull_request"
          body="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          grep -Fqx 'Release-Classification: non-release' <(printf '%s\n' "$body")
          echo "verifier_ready=false" >> "$GITHUB_OUTPUT"
      - name: Prove verifier bytes are from the trusted base
        if: ${{ steps.trusted.outputs.verifier_ready == 'true' }}
        env:
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          test "$TRUSTED_BASE_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse "$TRUSTED_BASE_SHA:scripts/release/audit_cli.py")" = \
            "$(git hash-object scripts/release/audit_cli.py)"
          test "$(git rev-parse "$TRUSTED_BASE_SHA:scripts/release/release_evidence.py")" = \
            "$(git hash-object scripts/release/release_evidence.py)"
      - name: Verify live producer, queue, PR, and commit evidence
        if: ${{ steps.trusted.outputs.verifier_ready == 'true' }}
        env:
          # This token is scoped only to verifier bytes from the immutable
          # protected base workflow boundary; it is never available while
          # checking out or executing PR-controlled bytes.
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name == 'pull_request_target' && 'pull_request' || github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PRODUCER_WORKFLOW_ID: ${{ vars.RELEASE_PRODUCER_WORKFLOW_ID }}
          PRODUCER_WORKFLOW_PATH: .github/workflows/release-credential-audit.yml
          PRODUCER_ARTIFACT_NAME: credential-audit-evidence.json
          MERGE_QUEUE_EVIDENCE_JSON: ${{ vars.MERGE_QUEUE_EVIDENCE_JSON }}
        run: python scripts/release/audit_cli.py
      - name: Report bootstrap non-release classification
        if: ${{ steps.trusted.outputs.verifier_ready == 'false' }}
        run: echo "release-please-credential-audit: N/A (trusted verifier is not present on the target base)"
