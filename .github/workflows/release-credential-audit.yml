name: Release credential audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

concurrency:
  group: release-credential-audit-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  protected-master-producer:
    name: protected-master-credential-audit-producer
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/master
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Emit protected producer evidence
        env:
          WORKFLOW_PATH: .github/workflows/release-credential-audit.yml
          OUTPUT: credential-audit-evidence.json
        run: python scripts/release/emit_credential_audit_evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: credential-audit-evidence.json
          path: credential-audit-evidence.json
          if-no-files-found: error

  release-please-credential-audit:
    name: release-please-credential-audit
    runs-on: ubuntu-latest
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - name: Checkout verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Never execute verifier bytes from the PR merge commit.  For a
          # merge_group this is the protected target revision; for a PR it is
          # the target branch revision that GitHub supplied in the event.
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Prove verifier bytes are from the trusted base
        env:
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          test "$TRUSTED_BASE_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse "$TRUSTED_BASE_SHA:scripts/release/audit_cli.py")" = \
            "$(git hash-object scripts/release/audit_cli.py)"
          test "$(git rev-parse "$TRUSTED_BASE_SHA:scripts/release/release_evidence.py")" = \
            "$(git hash-object scripts/release/release_evidence.py)"
      - name: Verify live producer, queue, PR, and commit evidence
        env:
          # This token is scoped only to the verifier that was checked out and
          # hash-verified from the trusted base above; it is never available
          # while checking out or executing PR-controlled bytes.
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PRODUCER_WORKFLOW_ID: ${{ vars.RELEASE_PRODUCER_WORKFLOW_ID }}
          PRODUCER_WORKFLOW_PATH: .github/workflows/release-credential-audit.yml
          PRODUCER_ARTIFACT_NAME: credential-audit-evidence.json
          MERGE_QUEUE_EVIDENCE_JSON: ${{ vars.MERGE_QUEUE_EVIDENCE_JSON }}
        run: python scripts/release/audit_cli.py
