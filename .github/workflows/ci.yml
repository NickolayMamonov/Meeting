name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        ready_for_review,
        converted_to_draft,
        labeled,
        unlabeled,
      ]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_ACTIONS_DOWNLOAD_ARTIFACT_SHA: d3f86a106a0bac45b974a628896c90dbdf5c8093
  ANDROID_ACTIONS_UPLOAD_ARTIFACT_SHA: ea165f8d65b6e75b540449e92b4886f43607fa02

jobs:
  static-analysis:
    name: ktlint + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4.4.2
      - name: Provision non-secret CI Firebase fixture
        run: cp app/google-services-ci.json app/google-services.json
      - name: ktlint
        run: ./gradlew ktlintCheck
      - name: Android Lint
        run: ./gradlew :app:lint
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-analysis-reports
          path: |
            **/build/reports/ktlint/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4.4.2
      - name: Provision non-secret CI Firebase fixture
        run: cp app/google-services-ci.json app/google-services.json
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Run release tooling tests
        run: python -m unittest discover -s scripts/release -p "test_*.py"
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

  assemble:
    name: Assemble debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4.4.2
      - name: Provision non-secret CI Firebase fixture
        run: cp app/google-services-ci.json app/google-services.json
      - name: Assemble debug
        run: ./gradlew assembleDebug

  android-signing-bootstrap-windows:
    name: Android signing bootstrap (Windows PowerShell 5.1)
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
      - name: Assert exact source revision
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          if ($actualSha -cne $env:EXPECTED_SHA) {
              throw "Checked-out revision does not match the event source revision"
          }
      - name: Assert credential isolation
        shell: powershell
        run: |
          $credentialVariables = @(
              "GH_TOKEN",
              "GITHUB_TOKEN",
              "GH_ENTERPRISE_TOKEN",
              "GITHUB_ENTERPRISE_TOKEN"
          )
          foreach ($name in $credentialVariables) {
              if (-not [string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($name))) {
                  throw "Credential variable is present: $name"
              }
          }

          $localConfigKeys = @(git config --local --name-only --list)
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to inspect repository-local Git credential configuration"
          }
          $credentialConfigKeys = @(
              $localConfigKeys | Where-Object {
                  $_ -match '^http\..*\.(authorization|extraheader)$'
              }
          )
          if ($credentialConfigKeys.Count -ne 0) {
              throw "Repository-local Git credential configuration is present: $($credentialConfigKeys -join ', ')"
          }
      - name: Parse Android signing bootstrap scripts
        shell: powershell
        run: |
          $files = @(
              "scripts/release/Initialize-AndroidReleaseSigning.ps1",
              "scripts/release/Initialize-AndroidReleaseSigning.Tests.ps1",
              "scripts/release/Initialize-AndroidReleaseSigning.Integration.Tests.ps1"
          )
          foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path $file),
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null
              if ($errors.Count -ne 0) {
                  $errors | ForEach-Object { Write-Error $_ }
                  throw "PowerShell parser rejected $file"
              }
          }
      - name: Run deterministic Android signing bootstrap tests
        shell: powershell
        run: |
          & ./scripts/release/Initialize-AndroidReleaseSigning.Tests.ps1
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
      - name: Run disposable Android signing bootstrap integration tests
        shell: powershell
        run: |
          & ./scripts/release/Initialize-AndroidReleaseSigning.Integration.Tests.ps1
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

  snapshot-build:
    name: Build unsigned dev snapshot
    needs: [static-analysis, unit-tests, assemble]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.static-analysis.result == 'success' && needs.unit-tests.result == 'success' && needs.assemble.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      # Firebase and certificate inputs are environment-scoped; the consumer
      # job must enter the protected snapshot boundary before checkout/build.
      name: android-snapshot-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact snapshot source identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev"
          printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$EXPECTED_SHA^{commit}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Assert integration workflow role
        run: python scripts/release/release_roles.py assert-ref --role integration --ref "$GITHUB_REF"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4.4.2
      - name: Provision snapshot Firebase configuration
        env:
          FIREBASE_JSON_B64: ${{ secrets.SNAPSHOT_GOOGLE_SERVICES_JSON_BASE64 }}
        run: printf '%s' "$FIREBASE_JSON_B64" | base64 --decode > app/google-services.json
      - name: Build unsigned snapshot
        env:
          ORG_GRADLE_PROJECT_ANDROID_SNAPSHOT_CERT_SHA256: ${{ vars.RELEASE_CERTIFICATE_SHA256 }}
          ORG_GRADLE_PROJECT_SNAPSHOT_RUN_NUMBER: ${{ github.run_number }}
          ORG_GRADLE_PROJECT_SNAPSHOT_RUN_ATTEMPT: ${{ github.run_attempt }}
          ORG_GRADLE_PROJECT_SNAPSHOT_COMMIT_SHA: ${{ github.sha }}
        run: ./gradlew generateSnapshotBuildMetadata :app:assembleSnapshot -PsnapshotRunNumber="${{ github.run_number }}" -PsnapshotRunAttempt="${{ github.run_attempt }}" -PsnapshotCommitSha="${{ github.sha }}"
      - name: Upload unsigned snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-snapshot-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/snapshot/*.apk
            app/build/release-metadata/snapshot-build.json
          if-no-files-found: error

  snapshot-sign:
    name: Sign snapshot on isolated runner
    needs: snapshot-build
    if: ${{ needs.snapshot-build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: android-snapshot-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Assert exact snapshot tooling and source role
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git -C release-tooling rev-parse HEAD)" = "$EXPECTED_SHA"
          git -C release-tooling cat-file -e "$EXPECTED_SHA^{commit}"
          python release-tooling/scripts/release/release_roles.py assert-ref \
            --role integration --ref "$GITHUB_REF"
          printf 'SNAPSHOT_SOURCE_BRANCH=%s\n' "${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-snapshot-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          path: unsigned
      - name: Resolve snapshot apksigner
        run: |
          set -euo pipefail
          apksigner="$(python release-tooling/scripts/release/android_sdk_tools.py apksigner)"
          apkanalyzer="$(python release-tooling/scripts/release/android_sdk_tools.py apkanalyzer)"
          test -x "$apksigner" && test -x "$apkanalyzer"
          printf 'APKSIGNER_PATH=%s\n' "$apksigner" >> "$GITHUB_ENV"
          printf 'APKANALYZER_PATH=%s\n' "$apkanalyzer" >> "$GITHUB_ENV"
      - name: Admit exact unsigned snapshot before keystore access
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          metadata_files=($(find unsigned -type f -name snapshot-build.json -print))
          apk_files=($(find unsigned -type f -name '*.apk' -print))
          test "${#metadata_files[@]}" -eq 1
          test "${#apk_files[@]}" -eq 1
          metadata="${metadata_files[0]}"
          apk="${apk_files[0]}"
          test -f "$metadata" && test -f "$apk"
          python release-tooling/scripts/release/verify_android_artifacts.py \
            --metadata "$metadata" --apk "$apk" \
            --apkanalyzer "$APKANALYZER_PATH" \
            --expected-debuggable true \
            --expected-commit "$EXPECTED_COMMIT" \
            --expected-source-branch "$SNAPSHOT_SOURCE_BRANCH" \
            --unsigned-apk
      - name: Decode snapshot keystore
        env:
          KEYSTORE_B64: ${{ secrets.SNAPSHOT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/snapshot-release.jks"
      - name: Sign and verify snapshot
        env:
          STORE_PASSWORD: ${{ secrets.SNAPSHOT_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SNAPSHOT_RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.RELEASE_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          apk="$(find unsigned -name '*.apk' -print -quit)"
          test -n "$apk"
          apksigner="$APKSIGNER_PATH"
          umask 077
          printf '%s' "$STORE_PASSWORD" > "$RUNNER_TEMP/snapshot-store-password"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/snapshot-key-password"
          "$apksigner" sign --ks "$RUNNER_TEMP/snapshot-release.jks" --ks-key-alias meet-release \
            --ks-pass "file:$RUNNER_TEMP/snapshot-store-password" \
            --key-pass "file:$RUNNER_TEMP/snapshot-key-password" "$apk"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/snapshot-signer.txt"
          grep -Eiq 'key algorithm: RSA' "$RUNNER_TEMP/snapshot-signer.txt"
          grep -Eiq 'key size( \(bits\))?: 4096' "$RUNNER_TEMP/snapshot-signer.txt"
          actual="$(sed -n 's/.*SHA-256 digest: //p' "$RUNNER_TEMP/snapshot-signer.txt" | head -n1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_CERT" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          test -n "$actual" && test "$actual" = "$expected"
          ! grep -qi 'Android Debug' "$RUNNER_TEMP/snapshot-signer.txt"
      - name: Upload signed snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-snapshot-signed-${{ github.run_number }}-${{ github.run_attempt }}
          path: unsigned
          if-no-files-found: error
      - name: Remove snapshot signing inputs
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/snapshot-release.jks" \
          "$RUNNER_TEMP/snapshot-store-password" \
          "$RUNNER_TEMP/snapshot-key-password"

  snapshot-evidence:
    name: Publish verified dev snapshot artifact
    needs: snapshot-sign
    if: ${{ needs.snapshot-sign.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Assert exact snapshot tooling and source role
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git -C release-tooling rev-parse HEAD)" = "$EXPECTED_SHA"
          python release-tooling/scripts/release/release_roles.py assert-ref \
            --role integration --ref "$GITHUB_REF"
          printf 'SNAPSHOT_SOURCE_BRANCH=%s\n' "${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-snapshot-signed-${{ github.run_number }}-${{ github.run_attempt }}
          path: signed
      - name: Resolve snapshot Android SDK tools
        run: |
          set -euo pipefail
          apksigner="$(python release-tooling/scripts/release/android_sdk_tools.py apksigner)"
          apkanalyzer="$(python release-tooling/scripts/release/android_sdk_tools.py apkanalyzer)"
          test -x "$apksigner" && test -x "$apkanalyzer"
          printf 'APKSIGNER_PATH=%s\n' "$apksigner" >> "$GITHUB_ENV"
          printf 'APKANALYZER_PATH=%s\n' "$apkanalyzer" >> "$GITHUB_ENV"
      - name: Verify snapshot identity and package evidence
        env:
          ORG_GRADLE_PROJECT_ANDROID_SNAPSHOT_CERT_SHA256: ${{ vars.RELEASE_CERTIFICATE_SHA256 }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          metadata_files=($(find signed -type f -name snapshot-build.json -print))
          apk_files=($(find signed -type f -name '*.apk' -print))
          test "${#metadata_files[@]}" -eq 1
          test "${#apk_files[@]}" -eq 1
          metadata="${metadata_files[0]}"
          apk="${apk_files[0]}"
          python release-tooling/scripts/release/verify_android_artifacts.py \
            --metadata "$metadata" \
            --apk "$apk" \
            --apksigner "$APKSIGNER_PATH" \
            --apkanalyzer "$APKANALYZER_PATH" \
            --expected-debuggable true \
            --expected-commit "$EXPECTED_COMMIT" \
            --expected-source-branch "$SNAPSHOT_SOURCE_BRANCH"
      - name: Prepare snapshot evidence
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          apk="$(find signed -name '*.apk' -print -quit)"
          metadata="$(find signed -name snapshot-build.json -print -quit)"
          mkdir -p snapshot-output
          python release-tooling/scripts/release/package_artifacts.py \
            --metadata "$metadata" \
            --output snapshot-output --apk "$apk" \
            --commit "$EXPECTED_COMMIT" \
            --source-branch "$SNAPSHOT_SOURCE_BRANCH" \
            --prepare-only
      - name: Attest snapshot subjects
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: snapshot-output/*
      - name: Collect canonical snapshot attestation evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python release-tooling/scripts/release/collect_attestation_evidence.py \
            --directory snapshot-output \
            --output "$RUNNER_TEMP/snapshot-attestation-evidence.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-ref refs/heads/dev --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Finalize snapshot evidence
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          metadata_files=($(find signed -type f -name snapshot-build.json -print))
          apk_files=($(find signed -type f -name '*.apk' -print))
          test "${#metadata_files[@]}" -eq 1
          test "${#apk_files[@]}" -eq 1
          metadata="${metadata_files[0]}"
          apk="${apk_files[0]}"
          python release-tooling/scripts/release/package_artifacts.py \
            --metadata "$metadata" \
            --output snapshot-output --apk "$apk" \
            --commit "$EXPECTED_COMMIT" \
            --source-branch "$SNAPSHOT_SOURCE_BRANCH" \
            --attestation-evidence "$RUNNER_TEMP/snapshot-attestation-evidence.json"
          python release-tooling/scripts/release/verify_chain.py snapshot-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-snapshot-${{ github.run_number }}-${{ github.run_attempt }}
          path: snapshot-output
          if-no-files-found: error
