name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis:
    name: ktlint + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4.4.2
      - name: Provision google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
      - name: ktlint
        run: ./gradlew ktlintCheck
      - name: Android Lint
        run: ./gradlew :app:lint
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-analysis-reports
          path: |
            **/build/reports/ktlint/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4.4.2
      - name: Provision google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  assemble:
    name: Assemble debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4.4.2
      - name: Provision google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
      - name: Assemble debug
        run: ./gradlew assembleDebug

  snapshot:
    name: Verified dev snapshot
    needs: [static-analysis, unit-tests, assemble]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.static-analysis.result == 'success' && needs.unit-tests.result == 'success' && needs.assemble.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4.4.2
      - name: Decode protected snapshot inputs
        id: inputs
        env:
          FIREBASE_JSON_B64: ${{ secrets.SNAPSHOT_GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_B64: ${{ secrets.SNAPSHOT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          temp="$RUNNER_TEMP/android-snapshot-inputs"
          mkdir -p "$temp"
          chmod 700 "$temp"
          printf '%s' "$FIREBASE_JSON_B64" | base64 --decode > "$temp/google-services.json"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$temp/release.jks"
          chmod 600 "$temp"/*
          echo "firebase=$temp/google-services.json" >> "$GITHUB_OUTPUT"
          echo "keystore=$temp/release.jks" >> "$GITHUB_OUTPUT"
      - name: Build snapshot
        env:
          ORG_GRADLE_PROJECT_ANDROID_SNAPSHOT_KEYSTORE_FILE: ${{ steps.inputs.outputs.keystore }}
          ORG_GRADLE_PROJECT_ANDROID_SNAPSHOT_STORE_PASSWORD: ${{ secrets.SNAPSHOT_RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ANDROID_SNAPSHOT_KEY_ALIAS: meet-release
          ORG_GRADLE_PROJECT_ANDROID_SNAPSHOT_KEY_PASSWORD: ${{ secrets.SNAPSHOT_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_ANDROID_SNAPSHOT_CERT_SHA256: ${{ vars.RELEASE_CERTIFICATE_SHA256 }}
          ORG_GRADLE_PROJECT_SNAPSHOT_RUN_NUMBER: ${{ github.run_number }}
          ORG_GRADLE_PROJECT_SNAPSHOT_RUN_ATTEMPT: ${{ github.run_attempt }}
          ORG_GRADLE_PROJECT_SNAPSHOT_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp "${{ steps.inputs.outputs.firebase }}" app/google-services.json
          ./gradlew generateSnapshotBuildMetadata :app:assembleSnapshot \
            -PsnapshotRunNumber="${{ github.run_number }}" \
            -PsnapshotRunAttempt="${{ github.run_attempt }}" \
            -PsnapshotCommitSha="${{ github.sha }}"
      - name: Verify snapshot APK
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/snapshot -name '*.apk' -print -quit)"
          test -n "$apk"
          apksigner verify --verbose --print-certs "$apk"
          if apksigner verify --verbose --print-certs "$apk" 2>&1 | grep -qi 'CN=Android Debug'; then
            echo "Android debug certificate is not accepted" >&2
            exit 1
          fi
      - name: Prepare snapshot evidence
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/snapshot -name '*.apk' -print -quit)"
          mkdir -p snapshot-output
          python scripts/release/package_artifacts.py \
            --metadata app/build/release-metadata/snapshot-build.json \
            --output snapshot-output --apk "$apk" --prepare-only
      - name: Attest snapshot subjects
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: snapshot-output/*
      - name: Collect canonical snapshot attestation evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/release/collect_attestation_evidence.py \
            --directory snapshot-output \
            --output "$RUNNER_TEMP/snapshot-attestation-evidence.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-ref refs/heads/dev \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Finalize snapshot evidence
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/snapshot -name '*.apk' -print -quit)"
          python scripts/release/package_artifacts.py \
            --metadata app/build/release-metadata/snapshot-build.json \
            --output snapshot-output --apk "$apk" \
            --attestation-evidence "$RUNNER_TEMP/snapshot-attestation-evidence.json"
          python scripts/release/verify_chain.py snapshot-output
      - name: Upload snapshot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-snapshot-${{ github.run_number }}-${{ github.run_attempt }}
          path: snapshot-output
          if-no-files-found: error
      - name: Remove protected snapshot inputs
        if: ${{ always() }}
        run: |
          rm -rf "$RUNNER_TEMP/android-snapshot-inputs"
          rm -f app/google-services.json
